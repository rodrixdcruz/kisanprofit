<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KisanProfit</title>
    <link rel="icon" type="image/svg+xml" href="frontend/public/favicon.svg" />
    <!--
      This file makes the repo root redirect to the built frontend so that
      static file servers (e.g. VS Code Live Server on :5500) open the app
      instead of showing the directory listing. Requires `npm run build`
      in frontend/ first (build output lands in frontend/dist/).
      For development, use the Vite dev server instead: `npm run dev` -> http://localhost:5173
    -->
    <meta http-equiv="refresh" content="0; url=frontend/dist/" />
  </head>
  <body>
    <p style="font-family: system-ui, sans-serif; padding: 2rem">
      Redirecting to <a href="frontend/dist/">KisanProfit</a>&hellip;
    </p>
  </body>
</html>
